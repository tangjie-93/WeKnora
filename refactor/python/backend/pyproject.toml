[project]
name = "weknora-python"
version = "0.1.0"
description = "Python re-implementation of the WeKnora backend (phased, API-compatible)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "openai>=1.55.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1.0",
    "jieba>=0.42.1",
    "cryptography>=43.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI 的 Depends(...) 默认参数是官方惯用法

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 需先设置环境变量再导入应用模块
