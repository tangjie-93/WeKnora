[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weknora-backend"
version = "0.1.0"
description = "Minimal Python health endpoint for the WeKnora rebuild"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
